name: Feature request
description: Suggest an improvement for StudyFlow AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What student problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the feature
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
