name: StudyFlow AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile backend/app.py
      - name: Validate JSON data files
        run: |
          python -m json.tool backend/data/resources.json > /dev/null
          python -m json.tool backend/data/roadmaps.json > /dev/null
      - name: Check required project files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f frontend/index.html
          test -f README.md
